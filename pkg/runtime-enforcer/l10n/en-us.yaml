product:
  runtimeEnforcer: Runtime Enforcer
typeLabel:
  security.rancher.io.workloadpolicyproposal: Policy Proposals

runtimeEnforcer:
  policyProposals:
    title: Policy Proposals
    banner:
      text: Each proposal is generated by the runtime enforcer's learning engine and represents an observed application profile that can be promoted to an active policy. Want to learn more? Read our <documentation>documentation</documentation>.
    filters:
      policy: Policy
      workload: Workload
      workloadType: Workload Type
      searchByName: Search by name
      any: Any
    actions:
      promote: Promote
      export: Export
      delete: Delete
      expandAll: Expand All
      collapseAll: Collapse All
    columns:
      policy: Policy
      namespace: Namespace
      workload: Workload
      workloadType: Workload Type
      containers: Containers
      executables: Executables
      age: Age
      containerName: Container
    selectedCount: |-
      {count, plural,
      =1 {selected}
      other {selected}
      }
    age:
      days: '{count} day | {count} days'
      hours: '{count} hour | {count} hours'
      minutes: '{count} minute | {count} minutes'
      justNow: just now
    fallback:
      na: N/A
      unnamedPolicy: Unnamed Policy
      noDescription: No additional details available.
      unknownAge: Unknown
    errors:
      loadFailed: Failed to load policy proposals.
    empty: No policy proposals found for the current filters.
  installationWizard:
    entry:
      title: Runtime Enforcer Installation
      description: Configure global repository authentication, add required OCI repositories, and install SUSE Security Runtime Enforcer dependencies.
    globalRepoAuth:
      step: Global Repository Authentication
      title: Global Repository Authentication
      description: Provide a global OCI authentication secret and optional TLS settings for chart repositories.
      caBundle: CA Bundle
      caBundlePlaceholder: Paste custom CA certificate content if required
      readFromFile: Read from File
      skipTlsVerification: Skip TLS verification
      allowPlainHttp: Allow plain HTTP
      secretNamespaces: Image Pull Secret Namespaces
      secretNamespacesDescription: Specify namespaces where image pull secrets and charts will be applied.
    namespaces:
      certManager: Cert-Manager Namespace
      csiDriver: Cert-Manager CSI Driver Namespace
      runtimeEnforcer: Runtime Enforcer Namespace
    placeholders:
      certManagerNamespace: cert-manager
      runtimeEnforcerNamespace: cattle-runtime-enforcer-system
    repositories:
      step: Add Required Repositories
      title: Add Required Repositories
      description: Add Cert-Manager, Cert-Manager CSI Driver, and SUSE Security Runtime Enforcer repositories.
    install:
      step: Install Charts
      certManager: Install Cert-Manager
      csiDriver: Install Cert-Manager CSI Driver
      runtimeEnforcer: Install SUSE Security Runtime Enforcer
      runtimeEnforcerButton: Install Runtime Enforcer
      certManagerDescription:
        Install and configure Cert-Manager through Rancher manager to satisfy the certificate requirements for SUSE Security Runtime Enforcer.
      csiDriverDescription:
        The cert-manager-csi-driver is used to automatically provision and mount TLS certificates directly inside SUSE Security Runtime Enforcer pods (agent and OTEL collector) without creating intermediate Secret resources.
      runtimeEnforcerDescription:
        The Runtime-Enforcer ships with a standalone OTEL collector Deployment that handles violation metrics and events forwarding. No external OpenTelemetry Collector is needed for a basic setup.
    button:
      start: Start Installation
      continue: Continue
  policyProposal:
    label: Policy Proposal
    policyName: Policy Name
    description: Description
    descriptionPlaceholder: Any text you want that better describes this configuration
    containerName: Container Name
    allowedExecutables: Allowed Executables
    executablePlaceholder: /usr/bin/executable
    addExecutable: Add Executable
    action:
      editPolicy: Edit Policy
      export: Export
      delete: Delete
      promote: Promote
    badges:
      learned: Learned
      manualEntry: Manual Entry
    masthead:
      namespace: Namespace
      workload: Workload
      workloadType: Workload Type
      containers: Containers
      executables: Executables
      age: Age
    containers:
      title: Containers
      table:
        container: Container
        image: Image
        executables: Executables
    exportDialog:
      title:
        single: Export as active policy
        bulk: Export as active policies
      banner:
        single: Before exporting, we will automatically convert the policy proposal to an active policy. This way you will be able to easily import it later into another environment.
        bulk: Before exporting, we will automatically convert each policy proposal to an active policy. This way you will be able to easily import it later into another environment.
      confirm:
        single: 'Are you sure you want to export the <b>{name}</b> policy proposal as an active policy? If so, please select the target mode below.'
        bulk: 'Are you sure you want to export the <b>selected policy proposals ({count})</b> as active policies? If so, please select the target mode below.'
      mode:
        monitor: Monitor mode
        protect: Protect mode
      cancel: Cancel
      export: Export
    deleteDialog:
      title:
        single: Delete policy proposal
        bulk: Delete policy proposals
      banner:
        single: Deleting the policy proposal without restarting the workload would result in a new empty proposal being created by the Runtime Enforcer for this workload - if this is your intention, you can edit the policy and manually remove all the executables. Otherwise, to allow the Runtime Enforcer to re-learn everything again, you must restart the workload as well.
        bulk: Deleting the policy proposal without restarting the workload would result in a new empty proposal being created by the Runtime Enforcer for this workload - if this is your intention, you can edit the policy and manually remove all the executables. Otherwise, to allow the Runtime Enforcer to re-learn everything again, you must restart the workloads as well.
      confirm:
        single: Are you sure you want to delete the <b>{name}</b> policy proposal and restart <b>{workload}</b> workload?
        bulk: Are you sure you want to delete the <b>selected policy proposals ({count})</b> and restart their corresponding workloads?
      cancel: Cancel
      delete:
        single: Delete Proposal and Restart Workload
        bulk: Delete Proposals and Restart Workloads
      growl:
        title:
          single: '{name} has been deleted'
          bulk: Selected policy proposals ({count}) have been deleted
        single: The policy proposal has been successfully deleted. Restarting the corresponding workload might take a few minutes to complete.
        bulk: The selected policy proposals ({count}) have been successfully deleted. Restarting the corresponding workloads might take a few minutes to complete.
    promoteDialog:
      title:
        single: Promote policy proposal to active policy
        bulk: Promote policy proposals to active policies
      banner:
        single: Promoting will create the active policy CRD and delete the proposal permanently afterwards. <b>This action cannot be undone.</b>
        bulk: For each proposal, promoting will create the active policy CRD and delete the proposal permanently afterwards. <b>This action cannot be undone.</b>
      confirm:
        single: 'Are you sure you want to promote the <b>{name}</b> policy proposal to active policy? If so, please select the target mode below to continue.'
        bulk: 'Are you sure you want to promote the <b>selected policy proposals ({count})</b> to active policies? If so, please select the target mode below to continue.'
      mode:
        monitor: Monitor mode
        protect: Protect mode
      cancel: Cancel
      promoteAndContinue: Promote and Continue
      applyStep:
        title:
          single: Apply the active policy on the workload
          bulk: Apply the active policies on the workloads
        banner:
          single: If the <b>{name}</b> workload is managed via GitOps (e.g., Fleet), we recommend manually applying the new active policy. Otherwise, the next (re)deployment will overwrite or remove the generated policy label.
          bulk: If at least one workload is managed via GitOps (e.g., Fleet), we recommend manually applying the new active policies. Otherwise, the next (re)deployment will overwrite or remove the generated policy labels.
        options:
          automatic:
            single: Automatically apply the active policy and restart the workload
            bulk: Automatically apply the active policies and restart the workloads
            tooltip: runtimeEnforcer.policyProposal.promoteDialog.applyStep.options.automatic.tooltip
          manual:
            single: Manually apply the active policy (recommended for GitOps)
            bulk: Manually apply the active policies (recommended for GitOps)
            tooltip: runtimeEnforcer.policyProposal.promoteDialog.applyStep.options.manual.tooltip
        manualDescription:
          single: To manually apply the active policy on the workload, you need to copy the label below on the corresponding workload and redeploy it. <learnMore>Learn more</learnMore>
          bulk: To manually apply the active policies on the workloads, you need to copy the labels below on the corresponding workloads and redeploy them. <learnMore>Learn more</learnMore>
      finish: Finish
      errorTitle: Failed to promote policy proposal
      growl:
        title:
          single: '{name} has been promoted to active policy'
          bulk: Selected policy proposals ({count}) have been promoted to active policies
        base:
          single: The policy proposal has been successfully promoted to an active policy.
          bulk: The selected policy proposals ({count}) have been successfully promoted to active policies.
        manual:
          single: Don't forget to manually apply the active policy on the corresponding workload and redeploy it.
          bulk: Don't forget to manually apply the active policies on the corresponding workloads and redeploy them.
        automatic:
          single: Restarting the corresponding workload might take a few minutes to complete.
          bulk: Restarting the corresponding workloads might take a few minutes to complete.
    errors:
      emptyPath: "Container {container}: Executable path at position {index} cannot be empty."
      invalidPath: "Container {container}: Executable path {path} must start with a leading slash /."
  activePolicies:
    title: Active Policies
    banner:
      text: In “Protect” mode, an active policy will only allow white-listed executables to run, whilst in “Monitor” mode it observes the violations (if any) without taking action. Want to learn more? Read our <documentation>documentation</documentation>
      documentation: documentation
    filters:
      policy: Policy
      workload: Workload
      workloadType: Workload Type
      mode: Mode
      status: Status
      searchByName: Search by name
      any: Any
    actions:
      changeMode: Change Mode
      export: Export
      delete: Delete
    columns:
      policy: Policy
      namespace: Namespace
      workload: Workload
      workloadType: Workload Type
      mode: Mode
      status: Status
      violations: Violations
      occurrences: Occurrences
    selectedCount: |-
      {count, plural,
      =1 {selected}
      other {selected}
      }
    fallback:
      na: N/A
      unnamedPolicy: Unnamed Policy
      noDescription: No additional details available.
      unknownAge: Unknown
    errors:
      loadFailed: Failed to load active policies.
    empty: No active policies found for the current filters.
    mode:
      monitor: Monitor
      protect: Protect
    status:
      transitioning: Transitioning
      ready: Ready
      failed: Failed
      popup:
        nodes: |-
          {count, plural,
          =1 {1 node}
          other {{count} nodes in total}
          }
        transitioning: |-
          {count, plural,
          =1 {is transitioning to the new mode (Monitor)}
          other {are transitioning to the new mode (Monitor)}
          }
        ready: |-
          {count, plural,
          =1 {is successfully enforcing this policy}
          other {are successfully enforcing this policy}
          }
        failed: failed enforcing this policy
    deleteDialog:
      title:
        single: Delete active policy
        bulk: Delete active policies
      banner:
        single: By default, deleting the active policy will not remove the labels applied on the workload - if you wish do to so, please select the desired option below.
        bulk: By default, deleting the active policies will not remove the labels applied on the workloads - if you wish do to so, please select the desired option below.
      confirm:
        single: Are you sure you want to delete the <b>{name}</b>? This action cannot be undone.
        bulk: Are you sure you want to delete the <b>selected active policies  ({count})</b>? This action cannot be undone.
      workloadRemovalOptions:
        keep:
          single: Do not remove the label of the active policy from the workload
          bulk: Do not remove the labels of the active policies from the workloads
        remove:
          single: Automatically remove the label of the active policy and restart the workload
          bulk: Automatically remove the labels of the active policies and restart the workloads
        manual:
          single: Manually remove the label of the active policy (recommended for GitOps)
          bulk: Manually remove the labels of the active policies (recommended for GitOps)
      manualRemoval:
        single: To manually remove the label of the active policy from the workload, you need to remove the label below from the corresponding workload and redeploy it.
        bulk: To manually remove the labels of the active policies from the workloads, you need to remove the labels below from the corresponding workloads and redeploy them.
      learnMore: Learn more
      cancel: Cancel
      delete: Delete
      deleteWithWorkloadRemoval:
        single: Delete Policy and Restart Workload
        bulk: Delete Policies and Restart Workloads
      growl:
        title:
          single: '{name} has been deleted'
          bulk: Selected active policies ({count}) have been deleted
        delete:
          single: The{name} active policy has been successfully deleted.
          bulk: The selected active policies ({count}) have been successfully deleted.
        autoRemoval:
          single: Restarting the corresponding workload might take a few minutes to complete.
          bulk: Restarting the corresponding workloads might take a few minutes to complete.
        manualRemoval:
          single: Don't forget to manually remove the labels of the active policy from the workload and redeploy it.
          bulk: Don't forget to manually remove the labels of the active policies from the workloads and redeploy them.
    changeModeDialog:
      title:
        single: Change mode for active policy
        bulk: Change mode for active policies
      banner:
        single: Switching to Monitor mode will disable active enforcement for this policy. Any executables that violate the policy will no longer be blocked. The Runtime Enforcer will only observe and log these violations.
        bulk: Switching to Monitor mode will disable active enforcement for this policy. Any executables that violate the policy will no longer be blocked. The Runtime Enforcer will only observe and log these violations.
      confirm:
        single: Are you sure you want to change the current mode for the monitoring-policy active policy from
        bulk: Are you sure you want to change the current mode for the <b>selected policies ({count})</b>? If so, please select the new mode below.
        bulkSame: Are you sure you want to change the current mode for the <b>selected policies ({count})</b> from
      cancel: Cancel
      changeMode: Change Mode
    exportDialog:
      confirm:
        single: 'Are you sure you want to export the <b>{name}</b> active policy? If so, please select the target mode below.'
        bulk: 'Are you sure you want to export the <b>selected active policies ({count})</b>? If so, please select the target mode below.'
